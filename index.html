<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VRS Route Guider</title>
  <style>
    :root {
      --accent: #0b5ed7;
      --text: #1c2430;
      --muted: #7a8494;
      --line: #e3e7ed;
      --bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    header span { color: var(--accent); }

    iframe { flex: 1; width: 100%; border: 0; }

    nav {
      display: flex;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }
    nav button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 0 12px;
      border: 0;
      border-top: 2px solid transparent;
      background: none;
      font: inherit;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }
    nav button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    nav button.active {
      color: var(--accent);
      border-top-color: var(--accent);
    }
  </style>
</head>
<body>

  <header><span>VRS</span> Route Guider</header>

  <iframe id="content" src="home.html" allow="geolocation" title="content"></iframe>

  <nav>
    <button id="homeBtn" class="active" onclick="go('home.html', this)">
      <svg viewBox="0 0 24 24">
        <path d="M3 11.5 12 4l9 7.5"/>
        <path d="M5.5 10v9.5h13V10"/>
        <path d="M10 19.5v-5h4v5"/>
      </svg>
      Home
    </button>
    <button id="mapBtn" onclick="go('map.html', this)">
      <svg viewBox="0 0 24 24">
        <path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/>
        <circle cx="12" cy="10" r="2.3"/>
      </svg>
      Maps
    </button>
  </nav>

  <script>
    function setActive(btn) {
      document.querySelectorAll('nav button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
    }

    function go(page, btn) {
      document.getElementById('content').src = page;
      setActive(btn);
    }

    // Called from home.html when a stop card is tapped:
    // opens the Maps page with the route to that stop
    function openMap(lat, lon, name, from) {
      var url = 'map.html?dlat=' + encodeURIComponent(lat) +
                '&dlon=' + encodeURIComponent(lon) +
                '&name=' + encodeURIComponent(name || 'Destination');
      if (from && from.lat != null && from.lon != null) {
        url += '&slat=' + encodeURIComponent(from.lat) + '&slon=' + encodeURIComponent(from.lon);
      }
      document.getElementById('content').src = url;
      setActive(document.getElementById('mapBtn'));
    }
  </script>
</body>
</html>
