<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <style>
    :root {
      --accent: #0b5ed7;
      --text: #1c2430;
      --muted: #7a8494;
      --line: #e3e7ed;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      padding: 22px 18px;
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 14px; }

    .quick { display: flex; gap: 8px; margin-bottom: 18px; }
    .quick button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 0;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      font: inherit;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }
    .quick button svg {
      width: 17px; height: 17px;
      stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .quick button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    /* ---------- Plain card (used by the loader) ---------- */
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fff;
    }
    .top { display: flex; align-items: center; gap: 12px; }

    /* ---------- Photo card: photo is the whole background ---------- */
    .card.photo {
      min-height: 140px;
      border: 0;
      background-color: #2b3a55;
      background-size: cover;
      background-position: center;
      box-shadow: 0 1px 6px rgba(20, 30, 50, 0.12);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s;
    }
    .card.photo:active { transform: scale(0.985); }
    .card.photo .top { align-items: flex-start; }

    .card.photo .num {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: var(--accent);
      font-size: 14px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    /* Text colour is chosen per text, from the photo behind it */
    .card.photo [data-a] {
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85), 0 0 8px rgba(0, 0, 0, 0.55);
    }
    .card.photo [data-a].on-dark {
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85), 0 0 8px rgba(0, 0, 0, 0.55);
    }
    .card.photo [data-a].on-light {
      color: #0d1420;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.95), 0 0 9px rgba(255, 255, 255, 0.75);
    }

    .card.photo .title { flex: 1; font-size: 17px; font-weight: 700; line-height: 1.25; padding-top: 4px; }
    .card.photo .dist { font-size: 16px; font-weight: 700; white-space: nowrap; padding-top: 4px; }

    .card.photo .dir {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .card.photo .dir svg {
      width: 15px; height: 15px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .card.photo .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .card.photo .chip {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 12px;
      border: 1px solid currentColor;
    }
    .card.photo .nodata { margin-top: 10px; font-size: 12px; font-weight: 500; }

    .msg { font-size: 14px; color: var(--muted); padding: 8px 0; }
    .retry {
      margin-top: 8px;
      padding: 9px 18px;
      border: 0;
      border-radius: 20px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    /* ---------- Loader ---------- */
    .loading-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--muted);
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid #dbe6fb;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .skeleton .bar {
      border-radius: 6px;
      background: linear-gradient(90deg, #eef1f5 25%, #f8f9fb 50%, #eef1f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s linear infinite;
    }
    .skeleton .circle { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
    .skeleton .b1 { flex: 1; height: 16px; }
    .skeleton .b2 { width: 52px; height: 16px; }
    .skeleton .b3 { width: 45%; height: 12px; margin-top: 12px; }
    .skeleton .b4 { width: 70%; height: 12px; margin-top: 8px; }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <h1>Quick access</h1>

  <div class="quick">
    <button data-type="bus" class="active">
      <svg viewBox="0 0 24 24">
        <rect x="4" y="3.5" width="16" height="14" rx="3"/>
        <path d="M4 11h16"/>
        <path d="M7 17.5V20M17 17.5V20"/>
      </svg>
      Bus
    </button>
    <button data-type="metro">
      <svg viewBox="0 0 24 24">
        <rect x="5" y="3" width="14" height="14" rx="4"/>
        <path d="M5 11h14"/>
        <path d="m8 21 2-4M16 21l-2-4"/>
      </svg>
      Metro
    </button>
    <button data-type="rail">
      <svg viewBox="0 0 24 24">
        <path d="M7 3h10v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V3Z"/>
        <path d="M7 9h10"/>
        <path d="M6 21l2.5-4M18 21l-2.5-4"/>
      </svg>
      Railway
    </button>
  </div>

  <div id="results"></div>

  <script>
    /* ---------- Your 9 photos: card 1, 2, 3 of each type, in order ---------- */
    const PHOTOS = {
      bus: [
        'https://i.ibb.co/ZRTKXGtB/IMG-49655d47-832e-45ad-8202-42078e0438f0.webp',
        'https://i.ibb.co/sdbR9hQz/IMG-e02c9627-c35e-4cef-97b4-283bdf37bf7f.jpg',
        'https://i.ibb.co/nNycszPM/IMG-c1f39b2c-c06b-434a-8266-fca5df3fef4e.jpg'
      ],
      metro: [
        'https://i.ibb.co/67HBb149/IMG-9de4e575-209a-4a76-bb0f-70c5c70726ab.jpg',
        'https://i.ibb.co/dsbkz7Sx/IMG-d65811f9-5abd-490a-87e8-765a93f4d9a4.jpg',
        'https://i.ibb.co/DfWfGqbn/IMG-a7817b68-c34a-4db7-846a-c066f14b45d9.jpg'
      ],
      rail: [
        'https://i.ibb.co/xt5vpCfV/IMG-281f1f59-ef2c-4e2f-a8ca-d2f74d5c8874.jpg',
        'https://i.ibb.co/jvvhkpNc/IMG-a7ea785b-9e9c-40e5-a5fc-d4a5f9e1f181.jpg',
        'https://i.ibb.co/ZpKjpkpt/IMG-1fa53e4f-b345-472a-b5c4-5ef6a13f5835.jpg'
      ]
    };

    const labels = { bus: 'bus stops', metro: 'metro stations', rail: 'railway stations' };
    const servers = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.private.coffee/api/interpreter',
      'https://overpass.openstreetmap.fr/api/interpreter'
    ];
    const results = document.getElementById('results');
    const cache = {};
    let myPos = null;
    let currentType = 'bus';
    let shown = [];            // the 3 stops on screen (used when a card is tapped)

    document.querySelectorAll('.quick button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.quick button').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentType = btn.dataset.type;
        start(currentType);
      });
    });

    // Load nearby bus stops automatically when the page opens
    start('bus');

    function show(text, retry) {
      results.innerHTML = '<p class="msg">' + escapeHtml(text) + '</p>' +
        (retry ? '<button class="retry" id="retryBtn">Try again</button>' : '');
      if (retry) {
        document.getElementById('retryBtn').onclick = function () { start(currentType); };
      }
    }

    // Spinner + placeholder cards while loading
    function loading(text) {
      const card =
        '<div class="card skeleton">' +
          '<div class="top"><div class="bar circle"></div><div class="bar b1"></div><div class="bar b2"></div></div>' +
          '<div class="bar b3"></div>' +
          '<div class="bar b4"></div>' +
        '</div>';
      results.innerHTML =
        '<div class="loading-row"><div class="spinner"></div><span>' + escapeHtml(text) + '</span></div>' +
        card + card + card;
    }

    function start(type) {
      if (cache[type]) { render(cache[type], type); return; }
      loading('Finding your location...');
      if (myPos) { search(type); return; }

      if (!navigator.geolocation) { show('Location is not supported on this device.'); return; }

      navigator.geolocation.getCurrentPosition(function (pos) {
        myPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        search(type);
      }, function () {
        show('Could not get your location. Please turn on location and allow permission.', true);
      }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
    }
        /* ---------- Overpass ---------- */
    function buildQuery(type, r) {
      const a = '(around:' + r + ',' + myPos.lat + ',' + myPos.lon + ')';
      let body = '';
      if (type === 'bus') {
        body = 'node["highway"="bus_stop"]' + a + ';';
      } else if (type === 'metro') {
        body = 'node["railway"="station"]["station"="subway"]' + a + ';' +
               'node["railway"="station"]["subway"="yes"]' + a + ';';
      } else {
        body = 'node["railway"="station"]["station"!="subway"]["subway"!="yes"]' + a + ';' +
               'node["railway"="halt"]' + a + ';';
      }
      return '[out:json][timeout:15];(' + body + ');out 100;';
    }

    // Ask one server, give up after 10 seconds
    function askServer(url, query) {
      const ctrl = new AbortController();
      const timer = setTimeout(function () { ctrl.abort(); }, 10000);
      return fetch(url, {
        method: 'POST',
        body: 'data=' + encodeURIComponent(query),
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        signal: ctrl.signal
      }).then(function (res) {
        clearTimeout(timer);
        if (!res.ok) { throw new Error('server ' + res.status); }
        return res.json();
      }).catch(function (e) {
        clearTimeout(timer);
        throw e;
      });
    }

    // Ask all servers at once, use the first good answer
    function overpass(query) {
      return new Promise(function (resolve, reject) {
        let failed = 0, lastErr = '';
        servers.forEach(function (s) {
          askServer(s, query)
            .then(function (data) {
              if (data && data.elements) { resolve(data); }
              else { throw new Error('empty reply'); }
            })
            .catch(function (e) {
              lastErr = e.message || String(e);
              failed++;
              if (failed === servers.length) { reject(new Error(lastErr)); }
            });
        });
      });
    }

    async function search(type) {
      const radii = type === 'bus' ? [1000, 3000, 8000] : [5000, 15000, 40000];
      if (currentType === type) { loading('Searching nearby ' + labels[type] + '...'); }

      try {
        let list = [];
        for (const r of radii) {
          const data = await overpass(buildQuery(type, r));
          list = pickThree(data.elements, type);
          if (list.length >= 3) { break; }
        }
        cache[type] = list;
        if (currentType === type) { render(list, type); }
      } catch (e) {
        if (currentType === type) {
          show('Could not load data (' + e.message + '). Try again.', true);
        }
      }
    }

    function pickThree(elements, type) {
      const withDist = elements.map(function (el) {
        const t = el.tags || {};
        return {
          name: t.name || (type === 'bus' ? 'Bus stop' : 'Station'),
          lat: el.lat,
          lon: el.lon,
          dist: distance(myPos.lat, myPos.lon, el.lat, el.lon),
          dir: direction(myPos.lat, myPos.lon, el.lat, el.lon),
          info: details(t)
        };
      }).sort(function (x, y) { return x.dist - y.dist; });

      // skip duplicates (same name very close, e.g. opposite sides of the road)
      const out = [];
      withDist.forEach(function (p) {
        if (out.length >= 3) { return; }
        const dup = out.some(function (o) { return o.name === p.name && Math.abs(o.dist - p.dist) < 150; });
        if (!dup) { out.push(p); }
      });
      return out;
    }

    // Small info tags from whatever data the stop has
    function details(t) {
      const info = [];
      if (t.ref) { info.push('Stop no. ' + t.ref); }
      if (t.local_ref) { info.push('Code ' + t.local_ref); }
      if (t.route_ref) { info.push('Routes ' + t.route_ref.replace(/;/g, ', ')); }
      if (t.line) { info.push('Line ' + t.line.replace(/;/g, ', ')); }
      if (t.operator) { info.push(t.operator); }
      else if (t.network) { info.push(t.network); }
      if (t.shelter === 'yes') { info.push('Shelter'); }
      if (t.bench === 'yes') { info.push('Bench'); }
      if (t.lit === 'yes') { info.push('Lit at night'); }
      if (t.wheelchair === 'yes') { info.push('Wheelchair access'); }
      return info;
    }

    function render(list, type) {
      if (!list.length) { show('No ' + labels[type] + ' found near you.', true); return; }
      shown = list;
      const pin = '<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>';

      results.innerHTML = list.map(function (p, i) {
        const chips = p.info.length
          ? '<div class="chips">' + p.info.map(function (x) { return '<span class="chip" data-a>' + escapeHtml(x) + '</span>'; }).join('') + '</div>'
          : '<div class="nodata" data-a>No extra details available</div>';

        return '<div class="card photo" data-i="' + i + '">' +
          '<div class="top">' +
            '<div class="num">' + (i + 1) + '</div>' +
            '<div class="title" data-a>' + escapeHtml(p.name) + '</div>' +
            '<div class="dist" data-a>' + fmt(p.dist) + '</div>' +
          '</div>' +
          '<div class="dir" data-a>' + pin + p.dir + ' of you</div>' +
          chips +
        '</div>';
      }).join('');

      // card 1, 2, 3 get photo 1, 2, 3 of this type (in order)
      const urls = PHOTOS[type] || [];
      results.querySelectorAll('.card.photo').forEach(function (card, i) {
        if (urls[i]) { loadPhoto(card, urls[i]); }
      });
    }

    /* ---------- Tap a card -> open Maps with the route to that stop ---------- */
    results.addEventListener('click', function (e) {
      const card = e.target.closest ? e.target.closest('.card.photo') : null;
      if (!card) { return; }
      const p = shown[Number(card.dataset.i)];
      if (p) { openRoute(p); }
    });

    function openRoute(p) {
      const from = myPos ? { lat: myPos.lat, lon: myPos.lon } : null;
      try {
        if (window.parent && window.parent !== window && typeof window.parent.openMap === 'function') {
          window.parent.openMap(p.lat, p.lon, p.name, from);
          return;
        }
      } catch (err) {}
      // fallback: open map.html directly
      let url = 'map.html?dlat=' + p.lat + '&dlon=' + p.lon + '&name=' + encodeURIComponent(p.name);
      if (from) { url += '&slat=' + from.lat + '&slon=' + from.lon; }
      location.href = url;
    }

    /* ---------- Photo + text colour that matches the photo ---------- */
    function loadPhoto(card, url) {
      const img = new Image();
      img.crossOrigin = 'anonymous';           // lets the app read the photo colours
      img.onload = function () {
        card.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
        card._img = img;
        adapt(card);
      };
      img.onerror = function () {
        // photo site did not allow reading colours: still show the photo,
        // text stays white with a dark outline
        const plain = new Image();
        plain.onload = function () {
          card.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
        };
        plain.src = url;
      };
      img.src = url;
    }

    // Look at the photo behind each text, then pick white or dark text
    function adapt(card) {
      const img = card._img;
      const els = card.querySelectorAll('[data-a]');
      els.forEach(function (el) { el.classList.remove('on-light', 'on-dark'); });

      const w = card.clientWidth, h = card.clientHeight;
      if (!img || !w || !h) { return; }

      try {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d', { willReadFrequently: true });

        // same fit as the card background (cover, centered)
        const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
        const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
        ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);

        const cr = card.getBoundingClientRect();
        els.forEach(function (el) {
          const r = el.getBoundingClientRect();
          const x = Math.max(0, Math.floor(r.left - cr.left - 4));
          const y = Math.max(0, Math.floor(r.top - cr.top - 3));
          const ww = Math.min(w - x, Math.ceil(r.width + 8));
          const hh = Math.min(h - y, Math.ceil(r.height + 6));
          if (ww <= 0 || hh <= 0) { el.classList.add('on-dark'); return; }

          const d = ctx.getImageData(x, y, ww, hh).data;
          let sum = 0, n = 0;
          for (let i = 0; i < d.length; i += 16) {
            sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
            n++;
          }
          const brightness = sum / n;
          // bright photo area -> dark text, dark photo area -> white text
          el.classList.add(brightness > 140 ? 'on-light' : 'on-dark');
        });
      } catch (e) {
        els.forEach(function (el) { el.classList.add('on-dark'); });
      }
    }

    let resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        document.querySelectorAll('.card.photo').forEach(adapt);
      }, 250);
    });

    /* ---------- Helpers ---------- */
    function distance(lat1, lon1, lat2, lon2) {
      const R = 6371000, rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function direction(lat1, lon1, lat2, lon2) {
      const rad = Math.PI / 180;
      const y = Math.sin((lon2 - lon1) * rad) * Math.cos(lat2 * rad);
      const x = Math.cos(lat1 * rad) * Math.sin(lat2 * rad) -
                Math.sin(lat1 * rad) * Math.cos(lat2 * rad) * Math.cos((lon2 - lon1) * rad);
      const deg = (Math.atan2(y, x) / rad + 360) % 360;
      const names = ['North', 'North-east', 'East', 'South-east', 'South', 'South-west', 'West', 'North-west'];
      return names[Math.round(deg / 45) % 8];
    }

    function fmt(m) {
      return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
  </script>
</body>
</html>
